<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Mildoc 管理后台登录</title>
</head>
<body>
    <h1>Mildoc 管理后台</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">
        <div>
            <label for="username">用户名</label>
            <input
                id="username"
                name="username"
                type="text"
                required
            >
        </div>

        <div>
            <label for="password">密码</label>
            <input
                id="password"
                name="password"
                type="password"
                required
            >
        </div>

        <button type="submit">登录</button>
    </form>
</body>
</html>
